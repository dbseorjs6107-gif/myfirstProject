<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인플루언서 리서치 툴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }
  .header { background: #1a1a2e; color: white; padding: 20px 30px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header span { font-size: 13px; opacity: 0.6; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  .input-box { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .input-box label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
  .input-box textarea { width: 100%; height: 120px; padding: 12px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 13px; outline: none; resize: vertical; line-height: 1.8; transition: border-color 0.2s; font-family: 'Segoe UI', sans-serif; }
  .input-box textarea:focus { border-color: #1a1a2e; }
  .input-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .url-count { font-size: 13px; color: #888; }
  .url-count span { font-weight: 700; color: #1a1a2e; }
  .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-primary { background: #1a1a2e; color: white; }
  .btn-primary:hover { background: #2d2d4e; }
  .btn-primary:disabled { background: #999; cursor: not-allowed; }
  .btn-export { background: #16a34a; color: white; }
  .btn-export:hover { background: #15803d; }
  .btn-danger { background: none; border: 1px solid #e0e0e0; color: #999; font-size: 12px; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .btn-danger:hover { border-color: #ef4444; color: #ef4444; }

  /* 큐 상태 박스 */
  .queue-box { background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; }
  .queue-stats { display: flex; gap: 20px; align-items: center; }
  .queue-stat { display: flex; flex-direction: column; align-items: center; }
  .queue-stat-label { font-size: 11px; color: #999; }
  .queue-stat-value { font-size: 18px; font-weight: 700; color: #1a1a2e; }
  .queue-stat-value.active { color: #d97706; }
  .queue-stat-value.done { color: #16a34a; }
  .queue-stat-value.err { color: #dc2626; }
  .queue-processing { font-size: 12px; color: #666; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 6px 12px; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue-processing.idle { background: #f1f5f9; border-color: #e2e8f0; color: #94a3b8; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar-left { display: flex; align-items: center; gap: 12px; }
  .count { font-size: 13px; color: #666; }
  .status-msg { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
  .status-msg.loading { background: #eff6ff; color: #1d4ed8; display: block; }
  .status-msg.error { background: #fef2f2; color: #dc2626; display: block; }
  .status-msg.success { background: #f0fdf4; color: #16a34a; display: block; }
  .table-wrap { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: #1a1a2e; color: white; }
  thead th { padding: 12px 14px; text-align: left; font-weight: 500; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
  tbody tr:hover { background: #f9f9ff; }
  tbody td { padding: 11px 14px; vertical-align: middle; }
  .url-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url-cell a { color: #1a1a2e; text-decoration: none; }
  .url-cell a:hover { text-decoration: underline; }
  .del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 4px; }
  .del-btn:hover { color: #ef4444; background: #fef2f2; }
  .empty { text-align: center; padding: 60px; color: #aaa; }
  .empty p { font-size: 15px; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>📊 인플루언서 리서치 툴</h1>
  <span>뷰티 마케팅 자동화</span>
</div>

<div class="container">

  <!-- URL 입력 -->
  <div class="input-box">
    <label>Instagram URL 입력 (여러 개는 줄바꿈으로 구분)</label>
    <textarea id="urlInput" placeholder="https://www.instagram.com/example1/
https://www.instagram.com/example2/
https://www.instagram.com/example3/"></textarea>
    <div class="input-row">
      <span class="url-count">감지된 URL: <span id="urlCountNum">0</span>개</span>
      <button class="btn btn-primary" id="queueBtn" onclick="addToQueue()">📥 대기열에 추가</button>
    </div>
  </div>

  <!-- 상태 메시지 -->
  <div id="statusMsg" class="status-msg"></div>

  <!-- 큐 상태 -->
  <div class="queue-box">
    <div class="queue-stats">
      <div class="queue-stat">
        <span class="queue-stat-value active" id="qPending">0</span>
        <span class="queue-stat-label">대기중</span>
      </div>
      <div class="queue-stat">
        <span class="queue-stat-value done" id="qCompleted">0</span>
        <span class="queue-stat-label">완료</span>
      </div>
      <div class="queue-stat">
        <span class="queue-stat-value err" id="qErrors">0</span>
        <span class="queue-stat-label">오류</span>
      </div>
      <div id="qProcessing" class="queue-processing idle">⏸ 대기 중</div>
    </div>
    <button class="btn-danger" onclick="clearQueue()">큐 초기화</button>
  </div>
  <div id="qErrorList" style="display:none; margin-top:8px; padding:10px 16px; background:#fef2f2; border-radius:8px; font-size:12px; color:#dc2626;"></div>

  <!-- 툴바 -->
  <div class="toolbar">
    <div class="toolbar-left">
      <span class="count" id="countText">총 0개</span>
      <button class="btn btn-danger" onclick="resetSession()">🔄 로그인 세션 초기화</button>
      <button class="btn btn-danger" onclick="deleteAll()" style="border-color:#ef4444;color:#ef4444;">🗑 전체 삭제</button>
    </div>
    <button class="btn btn-export" onclick="exportExcel()">⬇ 엑셀 다운로드</button>
  </div>

  <!-- 결과 테이블 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Instagram URL</th>
          <th>아이디</th>
          <th>표시명</th>
          <th>이메일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg">
      <div style="font-size:40px">🔍</div>
      <p>Instagram URL을 입력하고 대기열에 추가하세요</p>
    </div>
  </div>
</div>

<script>
  let allData = [];

  // URL 개수 실시간 감지
  document.getElementById('urlInput').addEventListener('input', function() {
    document.getElementById('urlCountNum').textContent = parseUrls(this.value).length;
  });

  function parseUrls(text) {
    return text.split('\n').map(u => u.trim()).filter(u => u.includes('instagram.com'));
  }

  // ─── 데이터 로드 & 렌더 ───────────────────────────────────
  async function loadData() {
    const res = await fetch('/api/data');
    allData = await res.json();
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const empty = document.getElementById('emptyMsg');
    document.getElementById('countText').textContent = `총 ${allData.length}개`;

    if (allData.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = allData.map(d => `
      <tr>
        <td class="url-cell"><a href="${d.url}" target="_blank">${d.url}</a></td>
        <td>@${d.username || ''}</td>
        <td>${d.displayName || ''}</td>
        <td>${d.email || '-'}</td>
        <td><button class="del-btn" onclick="deleteRow('${d.username}')">🗑</button></td>
      </tr>
    `).join('');
  }

  // ─── 큐 상태 폴링 ─────────────────────────────────────────
  async function refreshQueueStatus() {
    try {
      const res = await fetch('/api/queue/status');
      const s = await res.json();

      document.getElementById('qPending').textContent = s.pending;
      document.getElementById('qCompleted').textContent = s.completed;
      document.getElementById('qErrors').textContent = s.errors;

      const proc = document.getElementById('qProcessing');
      if (s.processing) {
        proc.className = 'queue-processing';
        proc.textContent = `⚙️ 처리중: ${s.processing}`;
      } else if (s.pending > 0) {
        proc.className = 'queue-processing';
        proc.textContent = `⏳ 다음 처리 대기 중...`;
      } else {
        proc.className = 'queue-processing idle';
        proc.textContent = '⏸ 대기 중';
      }

      // 오류 내역 표시
      const errBox = document.getElementById('qErrorList');
      if (s.errorList && s.errorList.length > 0) {
        errBox.style.display = 'block';
        errBox.innerHTML = '❌ 최근 오류:<br>' + s.errorList.map(e =>
          `<div style="margin-top:4px">• ${e.url}<br>&nbsp;&nbsp;→ ${e.error}</div>`
        ).join('');
      } else {
        errBox.style.display = 'none';
      }

      // 완료 수가 늘었으면 테이블 갱신
      if (s.completed !== allData.length) await loadData();
    } catch (e) {
      console.error('큐 상태 조회 실패:', e);
    }
  }

  // 15초마다 큐 상태 갱신 (서버 슬립 방지 겸용)
  setInterval(refreshQueueStatus, 15000);

  // ─── 대기열에 추가 ────────────────────────────────────────
  async function addToQueue() {
    const urls = parseUrls(document.getElementById('urlInput').value);
    if (urls.length === 0) return showStatus('올바른 Instagram URL을 입력해주세요', 'error');

    const btn = document.getElementById('queueBtn');
    btn.disabled = true;

    try {
      const res = await fetch('/api/queue', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ urls })
      });
      const result = await res.json();

      showStatus(`✅ ${result.added}개가 대기열에 추가됐습니다. 서버가 60초마다 1개씩 자동 처리합니다.`, 'success');
      document.getElementById('urlInput').value = '';
      document.getElementById('urlCountNum').textContent = '0';
      await refreshQueueStatus();
      setTimeout(() => hideStatus(), 5000);
    } catch (err) {
      showStatus('❌ 오류: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ─── 큐 초기화 ────────────────────────────────────────────
  async function clearQueue() {
    if (!confirm('대기 중인 URL을 전부 취소하겠습니까?')) return;
    await fetch('/api/queue', { method: 'DELETE' });
    await refreshQueueStatus();
    showStatus('🗑 큐가 초기화됐습니다.', 'success');
    setTimeout(() => hideStatus(), 3000);
  }

  // ─── 기타 기능 ────────────────────────────────────────────
  async function deleteRow(username) {
    if (!confirm('삭제하겠습니까?')) return;
    await fetch('/api/data/' + username, { method: 'DELETE' });
    await loadData();
  }

  async function deleteAll() {
    if (!confirm('저장된 인플루언서 데이터를 전체 삭제하겠습니까?')) return;
    await fetch('/api/data', { method: 'DELETE' });
    await loadData();
    showStatus('🗑 전체 삭제 완료', 'success');
    setTimeout(() => hideStatus(), 3000);
  }

  async function resetSession() {
    if (!confirm('로그인 세션을 초기화하면 다음 분석 시 다시 로그인해야 합니다. 계속하겠습니까?')) return;
    await fetch('/api/reset-session', { method: 'POST' });
    showStatus('🔄 세션 초기화 완료. 다음 분석 시 Instagram 로그인이 필요합니다.', 'success');
    setTimeout(() => hideStatus(), 4000);
  }

  function exportExcel() { window.location.href = '/api/export'; }

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + type;
  }

  function hideStatus() {
    document.getElementById('statusMsg').className = 'status-msg';
  }

  // 초기 로드
  loadData();
  refreshQueueStatus();
</script>
</body>
</html>
